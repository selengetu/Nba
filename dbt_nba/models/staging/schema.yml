version: 2
models:
  - name: stg_players
    description: Staging view of players. One row per player; player_id is unique.
    columns:
      - name: player_id
        description: Primary key. NBA person ID.
        tests: [unique, not_null]
      - name: full_name
        description: Player full name.
      - name: player_slug
        description: URL-friendly identifier.
      - name: from_year
        description: First year in league.
      - name: to_year
        description: Last year in league.
      - name: is_active
        description: "1 if currently active, 0 otherwise."
      - name: ingested_at
        description: When the row was loaded from the API.

  - name: stg_teams
    description: Staging view of teams. One row per team.
    columns:
      - name: team_id
        description: Primary key. NBA team ID.
        tests: [unique, not_null]
      - name: team_name
      - name: city
      - name: abbreviation
      - name: nickname
      - name: year_founded
      - name: ingested_at

  - name: stg_seasons
    description: Staging view of seasons (e.g. 2023-24).
    columns:
      - name: season_id
        description: Primary key (e.g. 2023-24).
        tests: [unique, not_null]
      - name: season_start_year
      - name: season_end_year
      - name: season_label
      - name: ingested_at

  - name: stg_player_season_stats
    description: "Staging view of raw player-season stats. Grain is player_id, season_id, team_id."
    columns:
      - name: player_id
        description: FK to players.
        tests:
          - not_null
          - relationships:
              to: ref('stg_players')
              field: player_id
      - name: season_id
        description: FK to seasons.
        tests:
          - not_null
          - relationships:
              to: ref('stg_seasons')
              field: season_id
      - name: team_id
        description: FK to teams.
        tests:
          - not_null
          - relationships:
              to: ref('stg_teams')
              field: team_id
      - name: games_played
      - name: minutes
      - name: points
      - name: rebounds
      - name: assists
      - name: steals
      - name: blocks
      - name: turnovers
      - name: fg_pct
      - name: fg3_pct
      - name: ft_pct
      - name: ingested_at
