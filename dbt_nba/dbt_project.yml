# dbt transform layer: raw (Snowflake load) -> staging -> marts
name: nba
version: "1.0.0"
config-version: 2

profile: nba

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nba:
    +meta:
      owner: data-engineering
      tier: bronze  # raw/staging = bronze; marts = silver/gold
    staging:
      +schema: staging
      +materialized: view
      +meta:
        tier: bronze
    marts:
      +schema: marts
      +materialized: table
      +meta:
        tier: silver
      # Incremental models: MERGE strategy; full refresh with --full-refresh when needed
      dim_players:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: player_id
      dim_teams:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: team_id
      dim_seasons:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: season_id
      fact_player_season_stats:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ['player_id', 'season_id', 'team_id']
        +cluster_by: ['season_id']
      player_season_performance:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ['player_id', 'season_id', 'team_id']
        +cluster_by: ['season_id']
      active_players:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: player_id
