# dbt transform layer: raw (Snowflake load) -> staging -> marts
name: nba
version: "1.0.0"
config-version: 2

profile: nba

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nba:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
